name: Build SMS Sorter APK

on:
  push:
    branches: ["master", "claude/**"]
    paths:
      - "sms-sorter-app/**"
      - ".github/workflows/sms-sorter-app.yml"
  pull_request:
    paths:
      - "sms-sorter-app/**"
      - ".github/workflows/sms-sorter-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # sms-sorter-app is its own Gradle build (Kotlin 2 + Compose), separate
        # from the repo-root build the other two apps share.
        working-directory: sms-sorter-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (sorting, parsers, delete rules)
        run: ./gradlew :core:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-sorter-debug-apk
          path: sms-sorter-app/app/build/outputs/apk/debug/*.apk

      # Same two-tag scheme as the other apps: -latest is the stable download
      # and only master writes it; -preview is overwritten by branch builds.
      - name: Publish APK to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk SmsSorter.apk
          gh release create sms-sorter-app-latest --prerelease \
            --title "SMS Sorter app (latest build)" \
            --notes "Auto-built debug APK of sms-sorter-app/. Download SmsSorter.apk on your phone and install it." \
            || true
          gh release upload sms-sorter-app-latest SmsSorter.apk --clobber

      - name: Publish preview APK to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk SmsSorter.apk
          gh release create sms-sorter-app-preview --prerelease \
            --title "SMS Sorter app (branch preview)" \
            --notes "Unreviewed build from a work-in-progress branch. Overwritten by every branch push — use the sms-sorter-app-latest release for the stable download." \
            || true
          gh release upload sms-sorter-app-preview SmsSorter.apk --clobber

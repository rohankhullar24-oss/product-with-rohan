name: Build Reminder App APK

on:
  push:
    branches: ["master", "claude/**"]
    paths: ["reminder-app/**", ".github/workflows/reminder-app.yml"]
  pull_request:
    paths: ["reminder-app/**", ".github/workflows/reminder-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: reminder-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reminders-debug-apk
          path: reminder-app/app/build/outputs/apk/debug/app-debug.apk

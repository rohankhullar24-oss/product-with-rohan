name: Build Reminder App APK

on:
  push:
    branches: ["master", "claude/**"]
    paths:
      - "reminder-app/**"
      - "usage-core/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/reminder-app.yml"
  pull_request:
    paths:
      - "reminder-app/**"
      - "usage-core/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/reminder-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Both apps and the shared usage-core module are one Gradle build rooted
      # at the repo, so the task is module-qualified and runs from the root.
      - name: Build debug APK
        run: ./gradlew :reminder-app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reminders-debug-apk
          path: reminder-app/app/build/outputs/apk/debug/*.apk

      # Also publish the APK on a rolling prerelease so it has a stable,
      # phone-friendly download URL (Actions artifacts require login + unzip).
      # Only master publishes: this asset is what the website links to, so a
      # work-in-progress branch build must never become the public download.
      - name: Publish APK to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp reminder-app/app/build/outputs/apk/debug/*.apk Reminders.apk
          gh release create reminder-app-latest --prerelease \
            --title "Reminders app (latest build)" \
            --notes "Auto-built debug APK of reminder-app/. Download Reminders.apk on your phone and install it." \
            || true
          gh release upload reminder-app-latest Reminders.apk --clobber

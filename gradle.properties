org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 8 defaults this to true, which keeps library resources out of each app's
# own R class. Both apps reference usage-core's strings (window names, reset
# countdowns) through their own R, so keep the merged behaviour.
android.nonTransitiveRClass=false

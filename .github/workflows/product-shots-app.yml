name: Build Product Shots APK

on:
  push:
    branches: ["master", "claude/**"]
    paths:
      - "android-app/**"
      - ".github/workflows/product-shots-app.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/product-shots-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # android-app is its own standalone Gradle build (it doesn't share
      # usage-core with the other two apps), so it builds from its own dir.
      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-shots-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk

      # public/product-shots.apk is what the website links to directly (the
      # "My Files" / hamburger menu download), unlike the other two apps
      # which publish to a GitHub release instead. Only master writes it, so
      # a work-in-progress branch build can never become the public download.
      - name: Update website's bundled APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          cp android-app/app/build/outputs/apk/debug/*.apk public/product-shots.apk
          if ! git diff --quiet -- public/product-shots.apk; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/product-shots.apk
            git commit -m "Update product-shots.apk from android-app build"
            git push
          fi
